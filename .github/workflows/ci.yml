name: CI

on:
  push:
    branches: [main, repo-analysis, agentgames/runproof]
  pull_request:
    branches: [main, repo-analysis, agentgames/runproof]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun x tsc --noEmit
